<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de notas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }

      form {
        margin-bottom: 15px;
      }

      li {
        margin: 6px 0;
        padding: 6px;
        background: white;
        border-radius: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .resaltar {
        background: yellow;
        font-weight: bold;
      }

      button {
        margin-left: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form id="form-Tarea">
      <h2>📔 Registro de notas</h2>
      <input type="text" id="inputNota" placeholder="Ingrese su nueva nota" />
      <button type="submit">Registrar nota</button>
    </form>

    <p>
      Filtro de notas:
      <input type="text" id="FiltroNotas" placeholder="Escriba para filtrar..." />
    </p>

    <ul id="lista"></ul>
    <p id="mensaje"></p>
    <p id="notasResaltadas"></p>
    <p id="notasNormales"></p>

    <script>
      /** @type {Array<{nota: string, fechaCreacion: string}>} */
      let notas = JSON.parse(localStorage.getItem("notas")) || [];

      const form = document.getElementById("form-Tarea");
      const input = document.getElementById("inputNota");
      const filtroEl = document.getElementById("FiltroNotas");
      const lista = document.getElementById("lista");
      const mensaje = document.getElementById("mensaje");
      const notasResaltadas = document.getElementById("notasResaltadas");
      const notasNormales = document.getElementById("notasNormales");

      const mostrarMensaje = (texto) => {
        mensaje.textContent = texto;
        setTimeout(() => {
          mensaje.textContent = "";
        }, 4000);
      };

      function guardarEnLocalStorage() {
        localStorage.setItem("notas", JSON.stringify(notas));
      }

      function formatearFecha(fecha) {
        return new Date(fecha).toLocaleString("es-CO", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      const mostrarNotas = () => {
        lista.innerHTML = "";

        const filtro = filtroEl.value.trim().toLowerCase();

        const filtradas = notas.filter((n) =>
          [n.nota, formatearFecha(n.fechaCreacion)].some((campo) => campo.toLowerCase().includes(filtro))
        );

        let totalResaltadas = 0;

        filtradas.forEach((e, i) => {
          const li = document.createElement("li");

          li.innerText = `${e.nota} (${formatearFecha(e.fechaCreacion)})`;

          if (e.resaltada) li.classList.add("resaltar");

          const btnResaltar = document.createElement("button");
          btnResaltar.textContent = "⭐ Resaltar";
          btnResaltar.onclick = () => {
            e.resaltada = !e.resaltada;
            guardarEnLocalStorage();
            mostrarNotas();
          };

          const btnEditar = document.createElement("button");
          btnEditar.textContent = "✍️ Editar";
          btnEditar.onclick = () => {
            const nuevoTexto = prompt(`Ingrese la nueva nota para: "${e.nota}"`);
            if (nuevoTexto && nuevoTexto.trim() !== "") {
              e.nota = nuevoTexto.trim();
              e.fechaCreacion = new Date();
              guardarEnLocalStorage();
              mostrarNotas();
              mostrarMensaje("✅ Nota editada con éxito!!!");
            } else {
              mostrarMensaje("⚠️ Operación cancelada o texto vacío");
            }
          };

          const btnEliminar = document.createElement("button");
          btnEliminar.textContent = "❌ Eliminar";
          btnEliminar.onclick = () => {
            notas.splice(i, 1);
            guardarEnLocalStorage();
            mostrarMensaje("❌ Nota eliminada con éxito!!!");
            mostrarNotas();
          };

          li.append(btnResaltar, btnEditar, btnEliminar);
          lista.appendChild(li);

          if (e.resaltada) totalResaltadas++;
        });

        notasNormales.textContent = `📔 Total de notas: ${filtradas.length}`;
        notasResaltadas.textContent = `⭐ Total de notas resaltadas: ${totalResaltadas}`;
      };

      form.addEventListener("submit", function (evento) {
        evento.preventDefault();

        const nota = input.value.trim();

        if (!nota) return mostrarMensaje("⚠️ Ingrese una nota válida !!!");

        const duplicado = notas.find((n) => n.nota.toLowerCase() === nota.toLowerCase());

        if (duplicado) {
          const confirmar = confirm(`☢️ Esta nota ya existe: "${duplicado.nota}". ¿Desea actualizarla?`);
          if (confirmar) {
            const nuevaNota = prompt("Ingrese la nueva versión de la nota:");
            if (nuevaNota && nuevaNota.trim() !== "") {
              duplicado.nota = nuevaNota.trim();
              duplicado.fechaCreacion = new Date();
              guardarEnLocalStorage();
              mostrarNotas();
              mostrarMensaje("✅ Nota actualizada con éxito");
              return;
            } else {
              mostrarMensaje("⚠️ Operación cancelada o texto vacío");
              return;
            }
          } else {
            mostrarMensaje("⚠️ Operación cancelada");
            return;
          }
        }

        notas.push({ nota, resaltada: false, fechaCreacion: new Date() });

        guardarEnLocalStorage();
        mostrarMensaje("✅ Nota agregada con éxito");

        input.value = "";
        mostrarNotas();
      });

      filtroEl.addEventListener("input", mostrarNotas);

      mostrarNotas();
    </script>
  </body>
</html>
